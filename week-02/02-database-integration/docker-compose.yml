services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: partner_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_schema_and_data.sql:/docker-entrypoint-initdb.d/01_schema_and_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d partner_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
