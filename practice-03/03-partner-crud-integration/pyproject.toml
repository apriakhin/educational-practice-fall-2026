[project]
name = "partner-crud-integration"
version = "0.1.0"
description = "Flask CRM with partner creation and editing"
requires-python = ">=3.9"
dependencies = [
    "flask==3.1.1",
    "psycopg2-binary==2.9.11",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
