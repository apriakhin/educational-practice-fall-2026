<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Реестр и карточки партнеров CRM">
    <title>{% block title %}CRM{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='resources/favicon.svg') }}" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
    <svg class="visually-hidden" aria-hidden="true">
        <symbol id="icon-error" viewBox="0 0 16 16">
            <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Zm0 3a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 7.75a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/>
        </symbol>
        <symbol id="icon-warning" viewBox="0 0 16 16">
            <path d="M7.13 2.04a1 1 0 0 1 1.74 0l6 10.5A1 1 0 0 1 14 14H2a1 1 0 0 1-.87-1.46l6-10.5ZM8 5a.75.75 0 0 0-.75.75v3.5a.75.75 0 0 0 1.5 0v-3.5A.75.75 0 0 0 8 5Zm0 7a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/>
        </symbol>
        <symbol id="icon-information" viewBox="0 0 16 16">
            <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Zm0 3.25a1 1 0 1 1 0 2 1 1 0 0 1 0-2Zm1 7.5H7.25a.75.75 0 0 1 0-1.5h.25v-2H7.25a.75.75 0 0 1 0-1.5h1a.75.75 0 0 1 .75.75v2.75a.75.75 0 0 1 0 1.5Z"/>
        </symbol>
    </svg>

    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('partner_list') }}">
                <img src="{{ url_for('static', filename='resources/logo.svg') }}" width="32" height="32" alt="">
                <span>Partner CRM</span>
            </a>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    {% block modals %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
