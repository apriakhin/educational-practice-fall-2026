services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: partner_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_schema_and_data.sql:/docker-entrypoint-initdb.d/01_schema_and_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d partner_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/partner_crm
      SECRET_KEY: change-this-in-production
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
